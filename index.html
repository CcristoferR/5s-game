<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamificación 5S</title>
    <style>
      html, body { margin: 0; overflow: hidden; height: 100%; font-family: system-ui, sans-serif; }
      #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
      /* Sin anillo de foco del navegador.

         Al escribir en un campo de la interfaz del juego, el lienzo toma el
         foco del teclado y el navegador le dibuja su contorno alrededor: unas
         rayas blancas por el borde de la pagina que no pertenecen al juego.
         Los campos son controles dibujados DENTRO del lienzo, asi que el
         contorno no senala nada util. */
      #renderCanvas:focus, #renderCanvas:focus-visible { outline: none; }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
