<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClassPlay</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0d0e10" />
    <style>
      html, body { margin: 0; overflow: hidden; height: 100%; font-family: system-ui, sans-serif; background: #0d0e10; }
      html[data-tema="claro"], html[data-tema="claro"] body { background: #f3f2ee; }
      #renderCanvas { width: 100%; height: 100%; display: block; touch-action: none; }
      /* Sin anillo de foco del navegador.

         Al escribir en un campo de la interfaz del juego, el lienzo toma el
         foco del teclado y el navegador le dibuja su contorno alrededor: unas
         rayas blancas por el borde de la pagina que no pertenecen al juego.
         Los campos son controles dibujados DENTRO del lienzo, asi que el
         contorno no senala nada util. */
      #renderCanvas:focus, #renderCanvas:focus-visible { outline: none; }

      /* Pantalla de arranque.

         Vive aca y no en el codigo del portal a proposito: el programa pesa
         varios megas y, mientras baja, no hay nada mas que mostrar. Escrita en
         la pagina, aparece en el primer instante, incluso con la red lenta de
         una planta, en vez de una pantalla en blanco.

         Una linea que recorre y no una barra que se llena: no hay forma
         honesta de saber cuanto falta. Se anima con transform, que el
         navegador sigue moviendo aunque este ocupado leyendo el programa. */
      #arranque {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background: #0d0e10;
        transition: opacity 0.36s ease;
      }
      html[data-tema="claro"] #arranque { background: #f3f2ee; }
      #arranque.arranque--saliendo { opacity: 0; pointer-events: none; }
      .arranque__centro { display: flex; flex-direction: column; align-items: center; gap: 30px; }
      .arranque__simbolo { width: 56px; height: 56px; }
      .arranque__cuadro { fill: #1f2328; }
      html[data-tema="claro"] .arranque__cuadro { fill: #0d0e10; }
      .arranque__linea {
        width: 112px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
      }
      html[data-tema="claro"] .arranque__linea { background: rgba(19, 20, 23, 0.1); }
      .arranque__linea span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #b8ed72;
        transform: translateX(-100%);
        animation: arranqueRecorrido 1.25s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      html[data-tema="claro"] .arranque__linea span { background: #43661d; }
      @keyframes arranqueRecorrido { to { transform: translateX(250%); } }
      .arranque__aviso {
        max-width: 300px;
        color: #9a9d96;
        font-size: 14px;
        line-height: 1.5;
        text-align: center;
      }
      html[data-tema="claro"] .arranque__aviso { color: #5e6059; }
      .arranque__aviso p { margin: 0 0 14px; }
      .arranque__aviso button {
        padding: 9px 18px;
        border: 0;
        border-radius: 8px;
        background: #b8ed72;
        color: #131a0d;
        font: 600 14px system-ui, sans-serif;
        cursor: pointer;
      }
      html[data-tema="claro"] .arranque__aviso button { background: #131417; color: #f5f4f0; }
      .arranque__aviso[hidden] { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .arranque__linea span { width: 100%; transform: none; opacity: 0.55; animation: none; }
      }
    </style>
    <script>
      // El tema guardado, antes de pintar nada: sin esto quien usa el tema
      // claro veria primero la pantalla negra y despues el salto a blanco.
      try {
        var preferencias = JSON.parse(localStorage.getItem("5s-preferencias") || "{}");
        if (preferencias.tema === "claro") document.documentElement.setAttribute("data-tema", "claro");
      } catch (error) {
        /* almacenamiento bloqueado: tema oscuro */
      }
    </script>
  </head>
  <body>
    <div id="arranque" role="status" aria-label="Cargando ClassPlay">
      <div class="arranque__centro">
        <svg class="arranque__simbolo" viewBox="0 0 64 64" aria-hidden="true">
          <rect class="arranque__cuadro" width="64" height="64" rx="14" />
          <path d="M40 17H26a15 15 0 0 0 0 30h14" fill="none" stroke="#B8ED72" stroke-width="6" />
          <path d="m31 24 12 8-12 8z" fill="#B8ED72" />
        </svg>
        <div class="arranque__linea" aria-hidden="true"><span></span></div>
        <div class="arranque__aviso" id="arranqueAviso" hidden>
          <p id="arranqueTexto">Está tardando más de lo normal. Revisa la conexión a internet.</p>
          <button type="button" onclick="location.reload()">Reintentar</button>
        </div>
      </div>
    </div>
    <canvas id="renderCanvas"></canvas>
    <script>
      // Se retira sola en cuanto el portal pone su primera pantalla (acceso,
      // catalogo, panel o verificacion): todas son un div.portal en el body.
      (function () {
        var arranque = document.getElementById("arranque");
        var aviso = document.getElementById("arranqueAviso");
        var texto = document.getElementById("arranqueTexto");
        var retirada = false;

        function retirar() {
          if (retirada) return;
          retirada = true;
          observador.disconnect();
          clearTimeout(espera);
          arranque.classList.add("arranque--saliendo");
          setTimeout(function () { arranque.remove(); }, 420);
        }

        var observador = new MutationObserver(function () {
          if (document.querySelector("body > .portal")) retirar();
        });
        observador.observe(document.body, { childList: true });

        // Si en 20 segundos no aparecio nada, algo anda mal con la red: se
        // ofrece reintentar en vez de dejar a la persona mirando una linea.
        var espera = setTimeout(function () { aviso.hidden = false; }, 20000);

        // Un archivo del programa que no llega (sin red, servidor caido) no
        // va a llegar esperando: se avisa al tiro.
        window.addEventListener(
          "error",
          function (evento) {
            var origen = evento.target;
            if (!retirada && origen && origen.tagName === "SCRIPT") {
              texto.textContent = "No se pudo cargar ClassPlay. Revisa la conexión a internet.";
              aviso.hidden = false;
            }
          },
          true
        );
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
